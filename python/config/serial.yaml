# Safe development defaults. For an actual EmotivPRO connection, set the port,
# set enabled=true, and set simulation_mode=false. Configure EmotivPRO with the
# same baud/framing/flow-control values.
port: null
baudrate: 115200
bytesize: 8
parity: N
stopbits: 1
timeout_seconds: 1.0
write_timeout_seconds: 1.0

# pyserial flow-control flags (all disabled = none).
xonxoff: false
rtscts: false
dsrdtr: false

enabled: false
simulation_mode: true
on_serial_failure: warning
encoding: uint8
minimum_code: 1
maximum_code: 255
